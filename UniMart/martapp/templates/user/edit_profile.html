{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4">
    <div class="max-w-3xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Edit Profile
            </h1>
            <p class="text-gray-500 mt-2">
                Update your personal information.
            </p>
        </div>

        <div class="bg-white rounded-3xl shadow-lg p-6 sm:p-10">
            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                <div class="flex flex-col items-center">

                    {% if profile.image %}
                    <img src="{{ profile.image.url }}" alt="Current Profile"
                        class="w-32 h-32 rounded-full object-cover border-4 border-gray-100 shadow-md">
                    {% else %}
                    <div class="w-32 h-32 rounded-full bg-gray-200 flex items-center justify-center">
                        <span class="text-gray-500 text-3xl font-bold">
                            {{ user.first_name|first|upper }}
                        </span>
                    </div>
                    {% endif %}
                    <label class="mt-4 cursor-pointer">
                        <span
                            class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium text-gray-700 transition">
                            Change Profile Image
                        </span>
                        <input type="file" name="image" class="hidden">
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            First Name
                        </label>
                        <input type="text" name="name" value="{{ user.first_name }}"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Last Name
                        </label>
                        <input type="text" name="last_name" value="{{ user.last_name }}"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>
                    <input type="text" name="username" value="{{ user.username }}"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input type="email" name="email" value="{{ user.email }}"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Phone
                    </label>
                    <input type="text" name="phone" value="{{ profile.phone }}"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        University
                    </label>
                    <input type="text" name="university" value="{{ profile.university }}"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Department
                    </label>
                    <input type="text" name="department" value="{{ profile.department }}"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Gender
                    </label>
                    <select name="gender"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-lime-400">

                        <option value="">Select Gender</option>

                        <option value="Male"{% if profile.gender == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female" {% if profile.gender == "Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other" {% if profile.gender == "Other" %}selected{% endif %}>
                            Other
                        </option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Bio
                    </label>
                    <textarea name="bio" rows="4"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-lime-400 resize-none"
                        placeholder="Write something about yourself...">{{ profile.bio }}</textarea>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 pt-4">
                    <button type="submit"
                        class="flex-1 py-3 rounded-xl bg-lime-500 text-white font-semibold hover:bg-emerald-600 transition duration-300">
                        Save Changes
                    </button>
                    <a href="{% url 'profile' %}"
                        class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 font-semibold text-center hover:bg-gray-200 transition duration-300">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
