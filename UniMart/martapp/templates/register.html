{% extends 'base.html' %}
{% block content %}
  <div class="max-w-md mx-auto my-16 bg-white shadow-lg rounded-xl p-8">
    <h2 class="text-3xl font-bold text-center text-slate-800 mb-8">Create Account</h2>
    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block mb-2 font-medium">First Name</label>
        <input type="text" name="first_name" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block mb-2 font-medium">Last Name</label>
        <input type="text" name="last_name" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block mb-2 font-medium">Username</label>
        <input type="text" name="username" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block mb-2 font-medium">Email</label>
        <input type="email" id="email" name="email" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />

        <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
          <div id="emailBar" class="h-2 rounded-full bg-red-500 transition-all duration-300" style="width:0%"></div>
        </div>

        <p id="emailText" class="text-sm mt-1"></p>
      </div>

      <div>
        <label class="block mb-2 font-medium">Phone</label>
        <input type="text" name="phone" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block mb-2 font-medium">Address</label>
        <input type="text" name="address" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block mb-2 font-medium">Password</label>
        <input type="password" id="password" name="password1" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />

        <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
          <div id="passwordBar" class="h-2 rounded-full bg-red-500 transition-all duration-300" style="width:0%"></div>
        </div>

        <p id="passwordText" class="text-sm mt-1"></p>
      </div>

      <div>
        <label class="block mb-2 font-medium">Confirm Password</label>
        <input type="password" name="password2" required class="w-full border rounded-lg px-4 py-3 outline-none focus:border-blue-500" />
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" name="is_active" required />
        <label>I agree to the Terms & Conditions</label>
      </div>

      <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-lg font-semibold duration-300">Register</button>

      <p class="text-center">
        Already have an account?
        <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login</a>
      </p>
    </form>
  </div>
  
  <script>

const email = document.getElementById("email");
const emailBar = document.getElementById("emailBar");
const emailText = document.getElementById("emailText");

email.addEventListener("input", function () {

    const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (this.value == "") {
        emailBar.style.width = "0%";
        emailBar.className = "h-2 rounded-full bg-red-500 transition-all duration-300";
        emailText.innerHTML = "";
    }

    else if (pattern.test(this.value)) {
        emailBar.style.width = "100%";
        emailBar.className = "h-2 rounded-full bg-green-500 transition-all duration-300";
        emailText.innerHTML = "Valid Email";
        emailText.className = "text-green-600 text-sm mt-1";
    }

    else {
        emailBar.style.width = "40%";
        emailBar.className = "h-2 rounded-full bg-red-500 transition-all duration-300";
        emailText.innerHTML = "Invalid Email";
        emailText.className = "text-red-600 text-sm mt-1";
    }

});



const password = document.getElementById("password");
const passwordBar = document.getElementById("passwordBar");
const passwordText = document.getElementById("passwordText");

password.addEventListener("input", function () {

    let score = 0;
    let pass = this.value;

    if (pass.length >= 8) score += 25;
    if (/[A-Z]/.test(pass)) score += 25;
    if (/[0-9]/.test(pass)) score += 25;
    if (/[^A-Za-z0-9]/.test(pass)) score += 25;

    passwordBar.style.width = score + "%";

    if (score <= 25) {
        passwordBar.className = "h-2 rounded-full bg-red-500 transition-all duration-300";
        passwordText.innerHTML = "Weak Password";
        passwordText.className = "text-red-600 text-sm mt-1";
    }

    else if (score <= 50) {
        passwordBar.className = "h-2 rounded-full bg-yellow-500 transition-all duration-300";
        passwordText.innerHTML = "Medium Password";
        passwordText.className = "text-yellow-600 text-sm mt-1";
    }

    else if (score <= 75) {
        passwordBar.className = "h-2 rounded-full bg-blue-500 transition-all duration-300";
        passwordText.innerHTML = "Good Password";
        passwordText.className = "text-blue-600 text-sm mt-1";
    }

    else {
        passwordBar.className = "h-2 rounded-full bg-green-500 transition-all duration-300";
        passwordText.innerHTML = "Strong Password";
        passwordText.className = "text-green-600 text-sm mt-1";
    }

});

</script>
{% endblock %}
