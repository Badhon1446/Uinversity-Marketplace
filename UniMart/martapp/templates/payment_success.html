<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-lg">
            <div class="bg-white rounded-3xl border border-gray-200 shadow-xl px-6 sm:px-10 py-10 text-center">
                <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900">
                    Payment Successful!
                </h1>
                <p class="text-gray-500 mt-3 text-sm sm:text-base leading-relaxed">
                    Thank you for your purchase. Your order is now being processed.
                </p>
                <div class="border-t border-gray-200 my-8"></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <a href="{% url 'rate_product' order.id %}"
                       class="flex items-center justify-center gap-2 py-3.5 px-5 rounded-xl bg-yellow-400 text-slate-900 font-bold hover:bg-yellow-300 transition duration-200">
                        Rate Product
                    </a>
                    <a href="{% url 'home' %}"
                       class="flex items-center justify-center gap-2 py-3.5 px-5 rounded-xl border border-gray-300 bg-white text-slate-700 font-semibold hover:bg-gray-50 transition duration-200">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
